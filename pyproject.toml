[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prom-grafana-kit"
version = "0.1.0"
description = "Generate Prometheus alert rules and Grafana dashboards from one YAML service spec, with a CI linter"
requires-python = ">=3.9"
dependencies = ["pyyaml>=6.0"]
license = { text = "MIT" }

[project.scripts]
monitorkit = "monitorkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
